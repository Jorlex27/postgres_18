services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_18_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./backup-scripts:/backup-scripts
      - ./backups:/backups
      - ./logs:/logs
    networks:
      - postgres_18_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backup-manager:
    build: ./backup-manager
    container_name: postgres-backup-manager
    restart: unless-stopped
    environment:
      # AWS Credentials
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-2}
      # S3 Configuration
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-postgres-backups}
      S3_STORAGE_CLASS: ${S3_STORAGE_CLASS:-STANDARD_IA}
      # PostgreSQL Configuration (for logging)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Paths
      BACKUP_DIR: /backups
      LOG_DIR: /logs
    volumes:
      - ./backups:/backups
      - ./logs:/logs
      - ./backup-manager/scripts:/s3-scripts
    networks:
      - postgres_18_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "aws", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres_18_data:
    driver: local

networks:
  postgres_18_network:
    driver: bridge
